name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v4
      - name: Install tools
        run: just install-tools-ci
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          install-only: true
      - name: CI
        run: just ci
